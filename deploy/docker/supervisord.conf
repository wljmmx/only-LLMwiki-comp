# OpsKG 单镜像进程管理（S13-4 多阶段构建）
#
# supervisord 同时管理 nginx + uvicorn 两个进程：
#   - nginx：前端静态资源 + 反向代理
#   - uvicorn：后端 FastAPI
#
# 任一进程异常退出 → supervisord 自动重启该进程
# 容器仅在 supervisor 自身被 SIGKILL 时退出（K8s/Docker 会重启 Pod）
#
# 注意：entrypoint.sh 以 root 启动 supervisord。
# nginx master 以 root 运行（supervisord 不设 user=），worker 通过 nginx.conf user 指令降权
# uvicorn 通过 supervisord user=opskg 降权

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[ rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

# ── nginx：前端 + 反向代理 ──
# 通过脚本文件启动（supervisord 引号解析限制，不能内联 -c）
# nginx master 以 root 运行，worker 进程通过 nginx.conf 中 user 指令降权到 opskg
[program:nginx]
command=/bin/sh /usr/local/bin/start-nginx.sh
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── uvicorn：后端 FastAPI ──
# 使用包装脚本验证依赖后启动，避免 shebang/依赖问题
[program:uvicorn]
command=/bin/sh /usr/local/bin/start-uvicorn.sh
user=opskg
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app",PYTHONUNBUFFERED="1",PATH="/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/app"
